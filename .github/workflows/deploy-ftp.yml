name: Publicar Barber Shop no FTP

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'tests/**'
      - 'scripts/**'
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Enviar arquivos para o FTP
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Publicar na pasta barbershop
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/barbershop/
          protocol: ftp
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*/**
            **/.github/**
            **/.ftp-deploy-sync-state.json
            **/config.php
            **/.installed
            **/config.example.php
            **/.env*
            **/README*.md
            **/TODO.md
            **/plan.md
            **/*.sql
            **/tests/**
            **/scripts/**
            **/mobile/**
            **/node_modules/**
            **/package*.json
            **/pnpm*.yaml
            **/app.config.ts
            **/Dockerfile
