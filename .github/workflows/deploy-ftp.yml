name: Publicar Barber Shop no FTP

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'tests/**'
      - 'scripts/**'
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Enviar arquivos para o FTP
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar configuração privada da prospecção
        env:
          BARBERSHOP_TAVILY_API_KEY: ${{ secrets.BARBERSHOP_TAVILY_API_KEY }}
          BARBERSHOP_OPENROUTER_API_KEY: ${{ secrets.BARBERSHOP_OPENROUTER_API_KEY }}
        run: |
          if [ -z "$BARBERSHOP_TAVILY_API_KEY" ] || [ -z "$BARBERSHOP_OPENROUTER_API_KEY" ]; then
            echo "::error::Configure BARBERSHOP_TAVILY_API_KEY e BARBERSHOP_OPENROUTER_API_KEY antes do deploy."
            exit 1
          fi
          mkdir -p prospeccao
          tavily_b64="$(printf %s "$BARBERSHOP_TAVILY_API_KEY" | base64 -w0)"
          openrouter_b64="$(printf %s "$BARBERSHOP_OPENROUTER_API_KEY" | base64 -w0)"
          printf "%s\n"             "<?php"             "return ["             "  'tavily_api_key' => base64_decode('$tavily_b64'),"             "  'openrouter_api_key' => base64_decode('$openrouter_b64'),"             "  'openrouter_model' => 'openrouter/free',"             "];" > prospeccao/config.local.php
          chmod 600 prospeccao/config.local.php

      - name: Publicar na pasta barbershop
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.sistemashp1.hospedagemdesites.ws
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/barbershop/
          protocol: ftp
          state-name: .barbershop-ftp-deploy-sync-state.json
          exclude: |
            **/.git*/**
            **/.github/**
            **/.ftp-deploy-sync-state.json
            **/config.php
            **/.installed
            **/config.example.php
            **/__apply_saas_migration.php
            **/__apply_tenant_migration.php
            **/.env*
            **/README*.md
            **/TODO.md
            **/plan.md
            **/*.sql
            **/tests/**
            **/scripts/**
            **/mobile/**
            **/node_modules/**
            **/package*.json
            **/pnpm*.yaml
            **/app.config.ts
            **/Dockerfile
