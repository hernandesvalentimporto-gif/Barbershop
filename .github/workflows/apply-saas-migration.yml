name: Aplicar migração administrativa temporária

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar instalador descartável
        run: |
          set -euo pipefail
          TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$TOKEN"
          sed -i "s/__MIGRATION_TOKEN__/$TOKEN/g" __apply_saas_migration.php
          echo "MIGRATION_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Publicar temporariamente o instalador pelo deploy oficial
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.sistemashp1.hospedagemdesites.ws
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/barbershop/
          protocol: ftp
          state-name: .barbershop-migration-sync-state.json
          dry-run: false
      - name: Executar migração e confirmar remoção automática
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 30 --get --data-urlencode "token=$MIGRATION_TOKEN" https://sistemashp.com.br/barbershop/__apply_saas_migration.php)"
          test "$response" = "migration_ok"
          if curl -fsS --max-time 10 -o /dev/null https://sistemashp.com.br/barbershop/__apply_saas_migration.php; then
            echo "temporary installer still responds; migration did not remove it"
            exit 1
          fi
          echo "Migration completed and temporary installer removed."
