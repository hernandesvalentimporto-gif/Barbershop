name: Gerar e publicar APK Android

on:
  push:
    branches: [apk/android-app]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Compilar APK corrigido
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Baixar a fonte aprovada da branch
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Configurar Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
      - name: Instalar dependências sem alterar lockfile
        run: pnpm install --frozen-lockfile --prod=false
      - name: Verificar TypeScript e regressão de abertura
        run: |
          pnpm check
          pnpm test
      - name: Instalar SDK Android e NDK compatíveis
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Preparar projeto Android com Expo
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Compilar APK ARM64 e x86_64 com JavaScript embutido
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 -Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1g' --stacktrace
      - name: Conferir assinatura e guardar candidato
        run: |
          mkdir -p ../build-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk ../build-artifacts/BarberShop-SistemasHP-Teste-v15.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs ../build-artifacts/BarberShop-SistemasHP-Teste-v15.apk
          (cd ../build-artifacts && sha256sum BarberShop-SistemasHP-Teste-v15.apk > SHA256SUMS.txt)
          printf '%s\n' 'Barber Shop Sistemas HP para Android 1.0.15: busca compacta de clientes, serviços e barbeiros, com horários ocupados desabilitados. ARM64 e x86_64. Assinatura de desenvolvimento Expo. Validado por instalação, abertura, tela Entrar e reabertura em emulador, sem login ou chamadas em produção. Instalação manual; sem publicação em lojas.' > ../build-artifacts/LEIA-ME.txt
      - name: Transferir candidato para a máquina de testes
        uses: actions/upload-artifact@v4
        with:
          name: BarberShop-SistemasHP-Candidato-v15
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Guardar erros de compilação
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            mobile/android/build/reports/
            mobile/android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  startup:
    name: Testar abertura em Android antes de liberar
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Baixar somente a fonte do teste
        uses: actions/checkout@v4
      - name: Baixar o APK candidato
        uses: actions/download-artifact@v4
        with:
          name: BarberShop-SistemasHP-Candidato-v15
          path: build-artifacts
      - name: Liberar disco dos toolchains que este teste não utiliza
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/ghc "$ANDROID_HOME/ndk"
          df -h /
      - name: Ativar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir release e verificar tela de login
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 3072M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: bash scripts/android-startup-smoke.sh ../build-artifacts/BarberShop-SistemasHP-Teste-v15.apk
      - name: Publicar APK no release para o link existente do site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_dir="$GITHUB_WORKSPACE/build-artifacts"
          apk="$artifact_dir/BarberShop-SistemasHP-Teste-v15.apk"
          public_apk="$artifact_dir/Barbershop-SistemasHP.apk"
          cp "$apk" "$public_apk"
          (cd "$artifact_dir" && sha256sum Barbershop-SistemasHP.apk > SHA256SUMS-release.txt)
          if gh release view v1.0.15 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.15 "$public_apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.15 "$public_apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Barbershop 1.0.15' \
              --notes-file "$artifact_dir/LEIA-ME.txt"
          fi
      - name: Disponibilizar APK após o teste de abertura
        uses: actions/upload-artifact@v4
        with:
          name: BarberShop-SistemasHP-APK-Teste-v15
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Guardar diagnósticos de abertura
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-diagnostics
          path: build-artifacts/startup-check/
          if-no-files-found: ignore
          retention-days: 7
