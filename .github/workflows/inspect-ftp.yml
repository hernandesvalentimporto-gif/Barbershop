name: Inspecionar caminhos FTP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ftp.sistemashp1.hospedagemdesites.ws
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Listar diretórios públicos
        shell: bash
        run: |
          set -u
          for path in / /public_html/ /public_html/barbershop/ /barbershop/ /controle_pessoal/ /public_html/controle_pessoal/; do
            echo "===== $path ====="
            curl --fail --show-error --silent --ftp-pasv \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --max-time 30 --list-only "ftp://$FTP_HOST$path" || echo "PATH_NOT_READABLE"
          done
